[package]
name = "homog"
version = "0.1.0"
edition = "2024"
description = "Not-So-Naive Map Colour Homogenisation: white, seamless paper for scanned map sheets, colours kept"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
gdal = "0.19.0"
gdal-sys = "0.12"
lcms2 = "6.2.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"

[profile.release]
lto = "thin"
codegen-units = 1
